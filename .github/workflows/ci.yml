name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: contact_center
          POSTGRES_USER: cc_registry
          POSTGRES_PASSWORD: cc_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc_registry -d contact_center"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run verification
        run: ./mvnw -B verify